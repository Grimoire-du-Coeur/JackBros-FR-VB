<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 150" width="1060" height="150" role="img"
     aria-label="Les six mondes de Jack Bros. et l'échéance de minuit">
  <title>Les six mondes, traduits</title>
  <defs>
    <filter id="g3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="railclip"><rect id="rc" x="90" y="60" width="0" height="4"/></clipPath>
    <pattern id="scan3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <style>
    text { font-family: ui-monospace, "SFMono-Regular", "Consolas", "Liberation Mono", monospace; }
    .num { fill: #8A0000; font-size: 12px; letter-spacing: 2px; }
    .nom { fill: #9E0000; font-size: 11.5px; letter-spacing: .5px;
            animation: light 10.0s linear infinite; }
    .nd rect { fill: #140000; stroke: #5E0000; stroke-width: 1.5; }
    .nd { animation: nodeon 10.0s linear infinite; }
    @keyframes nodeon {
      0%   { opacity: .45 }
      2%   { opacity: 1 }
      60%  { opacity: 1 }
      100% { opacity: .45 }
    }
    @keyframes light {
      0%   { fill: #5E0000 }
      3%   { fill: #FF3B2F }
      60%  { fill: #9E0000 }
      100% { fill: #5E0000 }
    }
    #rc { animation: fill 10.0s linear infinite; }
    @keyframes fill { 0% { width: 0 } 90% { width: 936px } 100% { width: 936px } }
    .mid { animation: midon 10.0s linear infinite; }
    @keyframes midon { 0%,80% { opacity: .3 } 88%,100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .nd,.nom,#rc,.mid { animation: none !important; }
      .nom { fill: #9E0000 } #rc { width: 936px } .mid { opacity: 1 }
    }
  </style>

  <rect width="1060" height="150" fill="#000"/>

  <!-- rail : trace eteint, puis la portion parcourue -->
  <rect x="90" y="60" width="936" height="4" rx="2" fill="#1A0000"/>
  <g clip-path="url(#railclip)">
    <rect x="90" y="60" width="936" height="4" rx="2" fill="#D40000"/>
  </g>

  <text class="num" x="90" y="36" text-anchor="middle">01</text>
  <text class="num" x="246" y="36" text-anchor="middle">02</text>
  <text class="num" x="402" y="36" text-anchor="middle">03</text>
  <text class="num" x="558" y="36" text-anchor="middle">04</text>
  <text class="num" x="714" y="36" text-anchor="middle">05</text>
  <text class="num" x="870" y="36" text-anchor="middle">06</text>
  <g filter="url(#g3)">
    <g class="nd" style="animation-delay:0.00s"><rect x="77" y="49" width="26" height="26" rx="3"/></g>
  <g class="nd" style="animation-delay:1.43s"><rect x="233" y="49" width="26" height="26" rx="3"/></g>
  <g class="nd" style="animation-delay:2.86s"><rect x="389" y="49" width="26" height="26" rx="3"/></g>
  <g class="nd" style="animation-delay:4.29s"><rect x="545" y="49" width="26" height="26" rx="3"/></g>
  <g class="nd" style="animation-delay:5.71s"><rect x="701" y="49" width="26" height="26" rx="3"/></g>
  <g class="nd" style="animation-delay:7.14s"><rect x="857" y="49" width="26" height="26" rx="3"/></g>
  </g>
  <text class="nom" x="90" y="106" text-anchor="middle" style="animation-delay:0.00s">Forêt des Fées</text>
  <text class="nom" x="246" y="106" text-anchor="middle" style="animation-delay:1.43s">Caverne du Faucheur</text>
  <text class="nom" x="402" y="106" text-anchor="middle" style="animation-delay:2.86s">Temple du Cauchemar</text>
  <text class="nom" x="558" y="106" text-anchor="middle" style="animation-delay:4.29s">Ventre Dragon</text>
  <text class="nom" x="714" y="106" text-anchor="middle" style="animation-delay:5.71s">Fort Mecha</text>
  <text class="nom" x="870" y="106" text-anchor="middle" style="animation-delay:7.14s">Palais Cristal</text>

  <!-- l'echeance : minuit -->
  <g class="mid" filter="url(#g3)">
    <rect x="1013" y="49" width="26" height="26" rx="3" fill="#2A0000"
          stroke="#FF3B2F" stroke-width="1.5"/>
    <circle cx="1026" cy="62" r="3" fill="#FF3B2F"/>
  </g>
  <text class="num" x="1026" y="36" text-anchor="middle" fill="#FF3B2F">00:00</text>
  <text class="nom" x="1026" y="106" text-anchor="middle" fill="#FF3B2F"
        style="animation:none">MINUIT</text>

  <rect width="1060" height="150" fill="url(#scan3)"/>
</svg>
